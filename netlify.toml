[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# SPA fallback. Functions declared with `config.path` (e.g. /api/*) are matched
# before redirects, so this rule never swallows API routes. Static files win too
# because the rule is not forced (no "!").
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
